schema_version: 1

context:
  version: 0.4.0

package:
  name: coreai-opt
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/coreai-opt/coreai_opt-${{ version }}.tar.gz
  sha256: 996657cc4f85438d0f4a33b1657bb469d040a1b5161388c8dd481aba4c0c67f0
  patches:
    # The conda-forge `ninja` package ships no pip metadata, so `pip check`
    # complains about the declared runtime dependency on ninja.
    - patches/0001-drop-ninja-from-install-requires.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=42
    - wheel
    - pip
  run:
    - python >=${{ python_min }},<3.14
    - numpy >=2
    - pydantic >=2.0.0
    - rich >=13.0.0
    - safetensors >=0.5.3
    - pytorch >=2.8.0
    - torchao >=0.15.0
    - tqdm >=4.65
    - ninja >=1.11
    - packaging >=23.0
    - pyyaml >=6.0
    - setuptools >=42
tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - '*'
      imports:
        - coreai_opt
      pip_check: true

about:
  summary: A library for PyTorch model compression and optimizations for deployment via Core AI on Apple silicon.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://pypi.org/project/coreai-opt/

extra:
  recipe-maintainers:
    - xhochy
