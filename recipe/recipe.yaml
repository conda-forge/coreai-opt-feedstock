schema_version: 1

context:
  version: 0.3.0

package:
  name: coreai-opt
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/coreai-opt/coreai_opt-${{ version }}.tar.gz
  sha256: 33fb96dbd22c7ec809918d0202f1a15954968bac863437b01a7594ab616ce329

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=42
    - wheel
    - pip
  run:
    - python >=${{ python_min }},<3.14
    - numpy >=2
    - pydantic >=2.0.0
    - rich >=13.0.0
    - safetensors >=0.5.3
    - pytorch >=2.8.0
    - torchao >=0.15.0
    - tqdm >=4.65
    - ninja >=1.11
    - setuptools >=42
    - pyyaml >=6.0
    - packaging >=23.0
tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - '*'
      imports:
        - coreai_opt
      pip_check: true

about:
  summary: A library for PyTorch model compression and optimizations for deployment via Core AI on Apple silicon.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://pypi.org/project/coreai-opt/

extra:
  recipe-maintainers:
    - xhochy
